name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: TKV benchmark on the bundled sample (fails if error > 1%)
        run: |
          python bench/tkv_benchmark.py backend/samples/segmentation.nii.gz --repeats 1 --out /tmp/ci_bench
          python -c "import csv,sys; r=next(csv.DictReader(open('/tmp/ci_bench.csv'))); sys.exit(abs(float(r['err_pct']))>1)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build   # CI=true here, so lint warnings fail the build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: End-to-end request through nginx -> Flask
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 2; done
          curl -sf -X POST -F use_sample=true -F creatinine_mg_dl=1.0 http://localhost:8080/api/analyze -o out.json
          python3 -c "import json; r=json.load(open('out.json')); print('volume_cm3', r['volume_cm3']); assert r['volume_cm3'] > 0"
      - if: always()
        run: docker compose logs --no-color | tail -50
