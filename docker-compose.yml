services:
  api:
    build: ./backend
    container_name: flask_api
    environment:
      - FLASK_ENV=production
    expose:
      - "5000"

  web:
    build: ./frontend
    container_name: react_web
    depends_on:
      - api
    expose:
      - "80"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
