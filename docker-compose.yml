# Local run:  docker compose up --build   ->  http://localhost:8080
# Production (adds Caddy + HTTPS for nephrorx.app):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    build: ./backend
    environment:
      - FLASK_ENV=production
    expose:
      - "5000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"   # nginx serves the React build and proxies /api/* to the api service
